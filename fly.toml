# Recode Collaboration Server Fly.io Configuration
# App: recode-collab (Primary Region: iad)

app = "recode-collab"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile-collab"

[env]
  HTTP_PORT = "8080"
  ZED_ENVIRONMENT = "production"
  DATABASE_MAX_CONNECTIONS = "5"
  RUST_LOG = "info,collab=debug"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
