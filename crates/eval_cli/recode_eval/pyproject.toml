[project]
name = "recode-eval"
version = "0.2.0"
description = "Harbor agent wrapper and remote orchestration CLI for Recode's eval-cli"
requires-python = ">=3.12"
dependencies = ["harbor==0.15.0", "modal==1.5.0"]

[project.scripts]
recode-eval = "recode_eval.cli:main"

[tool.setuptools]
packages = ["recode_eval"]
package-dir = { recode_eval = "." }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
