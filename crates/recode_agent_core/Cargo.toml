[package]
name = "recode_agent_core"
version = "0.1.0"
edition = "2021"
description = "Clean-room Agent panel, LLM provider integration, Model Context Protocol (MCP), and tools engine for Recode"

[dependencies]
recode_buffer = { path = "../recode_buffer" }
recode_shell = { path = "../recode_shell" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
