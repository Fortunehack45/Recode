[package]
name = "recode_lsp"
version = "0.1.0"
edition = "2021"
description = "Clean-room Language Server Protocol (LSP) client, diagnostics manager, and code completion engine for Recode"

[dependencies]
recode_buffer = { path = "../recode_buffer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }

[dev-dependencies]
