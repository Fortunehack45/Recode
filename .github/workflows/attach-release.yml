name: Attach Assets to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Action Run ID to attach from'
        required: true
        default: '42119928714'
      tag_name:
        description: 'Release Tag'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts from Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.inputs.run_id }} -R Fortunehack45/Recode
          ls -R

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in $(find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \)); do
            echo "Uploading $f to ${{ github.event.inputs.tag_name }}..."
            gh release upload ${{ github.event.inputs.tag_name }} "$f" --clobber -R Fortunehack45/Recode
          done
