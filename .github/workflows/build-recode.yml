name: Build and Release Recode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (Installer & Portable)
    runs-on: windows-2022
    env:
      RUST_BACKTRACE: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Pre-fetch WebRTC Prebuilt
        shell: pwsh
        run: |
          $targetDir = "$PWD/.webrtc"
          $triple = "win-x64-release"
          $url = "https://github.com/zed-industries/livekit-rust-sdks/releases/download/webrtc-0001d84-4/webrtc-$triple.zip"
          if (-not (Test-Path "$targetDir/$triple/webrtc.ninja")) {
            New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            Write-Host "Downloading WebRTC prebuilt ($url)..."
            $zipPath = "$targetDir/webrtc.zip"
            $downloadSuccess = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Download attempt $attempt..."
              curl.exe -fL --retry 3 --retry-delay 3 -o $zipPath $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zipPath) -and (Get-Item $zipPath).Length -gt 10000000) {
                $downloadSuccess = $true
                break
              }
              Write-Warning "Attempt $attempt failed or file too small, retrying in 5s..."
              Start-Sleep -Seconds 5
            }
            if (-not $downloadSuccess) {
              throw "Failed to download complete WebRTC prebuilt from $url"
            }
            Write-Host "Extracting WebRTC prebuilt..."
            if (Get-Command 7z.exe -ErrorAction SilentlyContinue) {
              7z.exe x $zipPath -o"$targetDir" -y | Out-Null
            } else {
              Expand-Archive -LiteralPath $zipPath -DestinationPath $targetDir -Force
            }
            Remove-Item $zipPath -Force
          }
          $webrtcPath = (Resolve-Path "$targetDir/$triple").Path
          "LK_CUSTOM_WEBRTC=$webrtcPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured LK_CUSTOM_WEBRTC=$webrtcPath"

      - name: Build Recode Binaries
        id: build
        shell: pwsh
        run: |
          cargo build --release --package recode --package cli --package auto_update_helper

      - name: Package Windows 1-Click Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}" -match "^v?([0-9]+\.[0-9]+\.[0-9]+.*)$") { $matches[1] } else { "auto" }
          .\script\build-installer-windows.ps1 -Version $ver -TargetDir "target/release" -OutputDir "dist"

      - name: Package Windows Portable Archive
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/portable -Force | Out-Null
          Copy-Item target/release/recode.exe dist/portable/Recode.exe -Force
          if (Test-Path target/release/cli.exe) {
            Copy-Item target/release/cli.exe dist/portable/recode-cli.exe -Force
          }
          if (Test-Path target/release/auto-update-helper.exe) {
            Copy-Item target/release/auto-update-helper.exe dist/portable/auto_update_helper.exe -Force
          }
          Copy-Item crates/zed/resources/windows/app-icon.ico dist/portable/app-icon.ico -Force
          Compress-Archive -Path dist/portable\* -DestinationPath dist/Recode-windows-x64-portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: Recode-windows-x64
          path: |
            dist/RecodeSetup-x64.exe
            dist/Recode-windows-x64-portable.zip
          if-no-files-found: warn

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev cmake clang lld llvm pkg-config \
            libsqlite3-dev libxcb-xfixes0-dev libxcb-shape0-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Pre-fetch WebRTC Prebuilt
        run: |
          TARGET_DIR="$PWD/.webrtc"
          TRIPLE="linux-x64-release"
          URL="https://github.com/zed-industries/livekit-rust-sdks/releases/download/webrtc-0001d84-4/webrtc-${TRIPLE}.zip"
          if [ ! -f "$TARGET_DIR/$TRIPLE/webrtc.ninja" ]; then
            mkdir -p "$TARGET_DIR"
            echo "Downloading WebRTC prebuilt with retry..."
            curl -fL --retry 5 --retry-delay 5 -o "$TARGET_DIR/webrtc.zip" "$URL"
            unzip -q -o "$TARGET_DIR/webrtc.zip" -d "$TARGET_DIR"
            rm -f "$TARGET_DIR/webrtc.zip"
          fi
          WEBRTC_PATH="$TARGET_DIR/$TRIPLE"
          echo "LK_CUSTOM_WEBRTC=$WEBRTC_PATH" >> "$GITHUB_ENV"
          echo "Configured LK_CUSTOM_WEBRTC=$WEBRTC_PATH"

      - name: Build Recode Binaries
        id: build
        run: |
          cargo build --release --package recode --package cli

      - name: Package Linux Binary
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p Recode-linux-x64
          cp target/release/recode Recode-linux-x64/recode
          if [ -f target/release/cli ]; then cp target/release/cli Recode-linux-x64/recode-cli; fi
          tar -czf Recode-linux-x64.tar.gz -C Recode-linux-x64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: Recode-linux-x64
          path: Recode-linux-x64.tar.gz

  build-macos:
    name: Build macOS Arm64
    runs-on: macos-latest
    env:
      RUST_BACKTRACE: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Pre-fetch WebRTC Prebuilt
        run: |
          TARGET_DIR="$PWD/.webrtc"
          TRIPLE="mac-arm64-release"
          URL="https://github.com/zed-industries/livekit-rust-sdks/releases/download/webrtc-0001d84-4/webrtc-${TRIPLE}.zip"
          if [ ! -f "$TARGET_DIR/$TRIPLE/webrtc.ninja" ]; then
            mkdir -p "$TARGET_DIR"
            echo "Downloading WebRTC prebuilt with retry..."
            curl -fL --retry 5 --retry-delay 5 -o "$TARGET_DIR/webrtc.zip" "$URL"
            unzip -q -o "$TARGET_DIR/webrtc.zip" -d "$TARGET_DIR"
            rm -f "$TARGET_DIR/webrtc.zip"
          fi
          WEBRTC_PATH="$TARGET_DIR/$TRIPLE"
          echo "LK_CUSTOM_WEBRTC=$WEBRTC_PATH" >> "$GITHUB_ENV"
          echo "Configured LK_CUSTOM_WEBRTC=$WEBRTC_PATH"

      - name: Build Recode Binaries
        id: build
        run: |
          cargo build --release --package recode --package cli

      - name: Package macOS Binary
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p Recode-macos-arm64
          cp target/release/recode Recode-macos-arm64/recode
          if [ -f target/release/cli ]; then cp target/release/cli Recode-macos-arm64/recode-cli; fi
          ditto -c -k --sequesterRsrc Recode-macos-arm64 Recode-macos-arm64.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: Recode-macos-arm64
          path: Recode-macos-arm64.zip

  publish-release:
    name: Publish GitHub Release & In-App Auto-Update Manifest
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Recode-windows-x64
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Recode-linux-x64
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Recode-macos-arm64
          path: release-assets

      - name: Generate Auto-Update Manifest (latest.json)
        id: manifest
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+ ]]; then
            VERSION="${TAG#v}"
            TAG="v${VERSION}"
          else
            BASE_VERSION=$(grep -m1 '^version' crates/zed/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION="${BASE_VERSION:-1.29.6}"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION} (${TAG})"

          cat <<EOF > release-assets/latest.json
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "url": "https://github.com/Fortunehack45/Recode/releases/download/${TAG}/RecodeSetup-x64.exe",
            "portable_url": "https://github.com/Fortunehack45/Recode/releases/download/${TAG}/Recode-windows-x64-portable.zip",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat release-assets/latest.json

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/*
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: Recode ${{ steps.manifest.outputs.tag }}
          draft: false
          prerelease: false

      - name: Commit latest.json to Repository
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p releases
          cp release-assets/latest.json releases/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main
          git add releases/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update latest.json for ${{ steps.manifest.outputs.tag }} [skip ci]"
            git push origin main
          fi
